#!/usr/sbin/nft -f
# Example only. Replace the placeholder networks with:
#   - the production cluster's egress IP (router -> node)
#   - your admin/SSH source IP
flush ruleset

table inet filter {
  set router_nets {
    type ipv4_addr
    flags interval
    elements = { 203.0.113.10/32 }
  }
  set admin_nets {
    type ipv4_addr
    flags interval
    elements = { 203.0.113.10/32 }
  }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    ip protocol icmp accept
    ip saddr @admin_nets tcp dport 22 accept
    ip saddr @router_nets tcp dport 443 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
