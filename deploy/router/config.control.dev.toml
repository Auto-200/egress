listen = "127.0.0.1:3128"
line = "hk"
connect_timeout_secs = 10

[tls]
ca = "certs/ca.crt"
client_cert = "certs/router.crt"
client_key = "certs/router.key"

[control_plane]
url = "http://127.0.0.1:8088"
token = "dev-internal-token-123456"
poll_interval_secs = 2

[health]
interval_secs = 2
failure_threshold = 3
success_threshold = 1
