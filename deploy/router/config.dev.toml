listen = "127.0.0.1:3128"
line = "dev"
connect_timeout_secs = 10

[tls]
ca = "certs/ca.crt"
client_cert = "certs/router.crt"
client_key = "certs/router.key"

[health]
interval_secs = 5
failure_threshold = 3
success_threshold = 1

[[nodes]]
name = "node-1"
endpoint = "127.0.0.1:8443"
server_name = "localhost"
